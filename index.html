<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta property="og:description" content="수수(SooSoo)는 학원 시험지 자동채점 앱 채크를 만듭니다. 앱 소개와 이용약관·개인정보처리방침, 사업자 정보를 한곳에 둡니다.">

<link rel="preload" href="/assets/fonts/Pretendard-sub.woff2" as="font" type="font/woff2" crossorigin>
<!-- 수수 회사 홈 · 임시판(2026-10-31) — 사장님 「홈페이지가 2개니까 … 채크쪽으로 옮기고 수수홈페이지를 다시 만들자」.
     채크 홍보 랜딩은 /chaeck/ 로 옮김. 이 판은 확정된 사실·문장만(새 문구 0 · 스크립트 0) — 정식판 = 마케팅 연구소 문구 + 클로드 디자인 시안 -->
<style>
@font-face{font-family:'Pretendard';font-weight:100 900;font-display:swap;src:url('/assets/fonts/Pretendard-sub.woff2') format('woff2')}
@font-face{font-family:'Paperlogy';font-weight:800;font-display:swap;src:url('/assets/fonts/Paperlogy-8-sub.woff2') format('woff2')}
:root{--paper:#F6F3EC;--card:#FFFFFF;--ink:#1B1A16;--ink-2:#5C5950;--ink-3:#8A867C;--line:rgba(27,26,22,.10);--g7:#0E6B50;--g1:#DEF3EB;
  --display:"Paperlogy","Pretendard",sans-serif;--body:"Pretendard",-apple-system,"Apple SD Gothic Neo",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--body);line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 40px}
.top{padding:28px 0}
.word{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.03em;text-decoration:none}
.word span{color:var(--ink-3);font-size:15px;margin-left:6px;letter-spacing:0}
main{flex:1}
.hero{padding:clamp(56px,12vh,140px) 0 56px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(44px,7vw,96px);line-height:1.05;letter-spacing:-.045em;margin:0}
.hero p{margin:22px 0 0;font-size:clamp(17px,1.6vw,20px);color:var(--ink-2);max-width:30em}
.apps{padding:0 0 96px}
.apps h2{font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--ink-3);margin:0 0 16px}
.app{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:24px;padding:28px 32px;background:var(--card);border-radius:24px;box-shadow:0 0 0 1px var(--line),0 24px 48px -32px rgba(27,26,22,.35)}
.app img.ic{width:72px;height:72px;border-radius:18px;display:block}
.app h3{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.03em;margin:0}
.app p{margin:4px 0 0;color:var(--ink-2)}
.app .go{display:inline-block;padding:14px 22px;border-radius:14px;background:var(--g7);color:#fff;font-weight:700;text-decoration:none;white-space:nowrap}
.stores{display:flex;gap:10px;margin-top:14px}
.stores img{display:block;height:40px;width:auto}
.foot{border-top:1px solid var(--line);padding:32px 0 40px;font-size:13.5px;color:var(--ink-2)}
.links{display:flex;flex-wrap:wrap;gap:6px 20px;margin-bottom:18px}
.links a{text-decoration:none}
.biz{display:flex;flex-wrap:wrap;gap:4px 22px;margin:0}
.biz div{display:flex;gap:6px}
.biz dt{color:var(--ink-3)}
.biz dd{margin:0}
.cr{margin:16px 0 0;color:var(--ink-3)}
@media (max-width:720px){
  .wrap{padding:0 20px}
  .app{grid-template-columns:auto 1fr;padding:22px}
  .app .go{grid-column:1/-1;text-align:center}
}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="word" href="/">수수<span>SooSoo</span></a></div></header>
<main class="wrap">
  <section class="hero">
    <h1>수수 SooSoo</h1>
    <p>수수(SooSoo)는 학원 시험지 자동채점 앱 채크를 만듭니다.</p>
  </section>
  <section class="apps" aria-labelledby="apps-h">
    <h2 id="apps-h">만드는 앱</h2>
    <article class="app">
      <img class="ic" src="/chaeck/img/icon.webp" alt="">
      <div>
        <h3>채크</h3>
        <p>학원 시험지 자동채점</p>
        <div class="stores"><a href="https://apps.apple.com/kr/app/id6788668772"><img src="/assets/badges/app-store-ko.svg" alt="App Store에서 다운로드" width="130" height="40"></a><a href="https://play.google.com/store/apps/details?id=com.chaeck.app"><img src="/assets/badges/google-play-ko.png" alt="Google Play에서 다운로드" width="135" height="40"></a></div>
      </div>
      <a class="go" href="/chaeck/">채크 홈페이지 →</a>
    </article>
  </section>
</main>
<footer class="foot"><div class="wrap">
  <nav class="links">
    <a href="https://chaeck.soosoo.kr/terms">채크 이용약관</a>
    <a href="https://chaeck.soosoo.kr/privacy"><b>채크 개인정보처리방침</b></a>
    <a href="mailto:soosoo.labs@gmail.com">문의 soosoo.labs@gmail.com</a>
  </nav>
  <dl class="biz">
    <div><dt>상호</dt><dd>수수 (SooSoo)</dd></div>
    <div><dt>대표</dt><dd>이상훈</dd></div>
    <div><dt>사업자등록번호</dt><dd>725-61-00925</dd></div>
    <div><dt>통신판매업 신고번호</dt><dd>제2026-경기안산-2007호</dd></div>
    <div><dt>사업장 주소</dt><dd>경기도 안산시 상록구 이호로4길 14, 503호</dd></div>
    <div><dt>대표전화</dt><dd>010-9821-2506</dd></div>
    <div><dt>문의</dt><dd>soosoo.labs@gmail.com</dd></div>
  </dl>
  <p class="cr">© 2026 수수</p>
</div></footer>
</body>
</html>
